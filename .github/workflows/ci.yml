{
  "name": "CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": ["main"]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "app": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Install pnpm",
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "9.0.0"
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24",
            "cache": "pnpm"
          }
        },
        {
          "name": "Install dependencies",
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Lint",
          "run": "pnpm lint"
        },
        {
          "name": "Type check",
          "run": "pnpm ts-check"
        },
        {
          "name": "Unit tests",
          "run": "pnpm test"
        },
        {
          "name": "Production build",
          "run": "pnpm build",
          "env": {
            "APP_URL": "https://ci.invalid",
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY": "sb_publishable_ci_placeholder",
            "NEXT_PUBLIC_SUPABASE_URL": "https://ci-placeholder.supabase.co"
          }
        }
      ]
    },
    "database": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Install pnpm",
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "9.0.0"
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24",
            "cache": "pnpm"
          }
        },
        {
          "name": "Install dependencies",
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Start local Supabase",
          "run": "pnpm db:start"
        },
        {
          "name": "Reset local database",
          "run": "pnpm db:reset"
        },
        {
          "name": "Run pgTAP tests",
          "run": "pnpm db:test"
        },
        {
          "name": "Lint local database",
          "run": "pnpm db:lint"
        },
        {
          "name": "Verify generated database types",
          "run": "pnpm db:types:check"
        },
        {
          "name": "Stop local Supabase",
          "if": "${{ always() }}",
          "run": "pnpm db:stop -- --no-backup"
        }
      ]
    }
  }
}
